services:
  - type: web
    name: cbtrade-ppt-converter-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --access-logfile - --error-logfile -
    healthCheckPath: /health
    autoDeploy: true
