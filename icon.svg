 <linearGradient id="ppt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a3d"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".22"/></filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
