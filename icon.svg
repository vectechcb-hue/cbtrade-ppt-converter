<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset=".48" stop-color="#e0f2fe"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
