<script>
const $=id=>document.getElementById(id);
function show(id,text){$(id).textContent=text;$(id).style.display='block'}
function hide(id){$(id).style.display='none'}
function setStatus(text,sub=''){ $('status').innerHTML='<div class="spin"></div><div>'+text+'</div><small>'+sub+'</small>'; $('status').style.display='block' }
function waitForGlobal(globalName,timeoutMs=15000,errorMessage='所需元件尚未載入，請確認網路後重試'){
  if(window[globalName])return Promise.resolve(window[globalName]);
  return new Promise((resolve,reject)=>{
    const script=[...document.scripts].find(s=>s.src&&s.src.includes(globalName==='pdfjsLib'?'pdf.min.js':'opencc'));
    if(!script){reject(new Error(errorMessage));return}
    let done=false;
    const finish=(err)=>{if(done)return;done=true;clearTimeout(timer);err?reject(err):resolve(window[globalName])};
    script.addEventListener('load',()=>window[globalName]?finish():finish(new Error(errorMessage)),{once:true});
    script.addEventListener('error',()=>finish(new Error(errorMessage)),{once:true});
    const timer=setTimeout(()=>finish(new Error(errorMessage)),timeoutMs);
  });
}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
let cachedCompanyLogoData=null;
async function getCompanyLogoData(overrideFile){
  if(overrideFile)return fileToDataURL(overrideFile);
  if(cachedCompanyLogoData)return cachedCompanyLogoData;
  const response=await fetch('./assets/vectech-logo.png.b64');
  if(!response.ok)throw new Error('內建威鐵克 Logo 載入失敗，請重新整理 App 後再試');
  cachedCompanyLogoData='data:image/png;base64,'+(await response.text()).trim();
  return cachedCompanyLogoData;
}
let cachedClosingReferenceBytes=null;
async function getClosingReferenceBytes(){
  if(cachedClosingReferenceBytes)return cachedClosingReferenceBytes;
  const response=await fetch('./assets/thank-you-reference.png.b64');
  if(!response.ok)throw new Error('承邦結尾版型載入失敗，請重新整理 App 後再試');
  const binary=atob((await response.text()).trim());
  cachedClosingReferenceBytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
  return cachedClosingReferenceBytes;
}
function download(blob,name){
  // 唯一下載物件：PPTX Blob。程式不建立任何 TXT／文字檔。
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=u;a.download=name;a.type='application/vnd.openxmlformats-officedocument.presentationml.presentation';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
  show('ok','✅ 轉檔完成，僅輸出 1 個 PPTX 檔案。');
}
function cleanXml(text){return text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
const TC_CHAR_MAP={报:'報',备:'備',编:'編',标:'標',补:'補',参:'參',侧:'側',测:'測',产:'產',偿:'償',场:'場',称:'稱',础:'礎',传:'傳',纯:'純',导:'導',电:'電',动:'動',独:'獨',对:'對',发:'發',阀:'閥',丰:'豐',构:'構',关:'關',规:'規',国:'國',过:'過',号:'號',后:'後',户:'戶',护:'護',换:'換',监:'監',减:'減',检:'檢',见:'見',键:'鍵',脚:'腳',节:'節',洁:'潔',结:'結',劲:'勁',经:'經',净:'淨',径:'徑',据:'據',觉:'覺',开:'開',扩:'擴',来:'來',连:'連',灵:'靈',领:'領',录:'錄',滤:'濾',码:'碼',脑:'腦',盘:'盤',喷:'噴',气:'氣',浅:'淺',枪:'槍',强:'強',热:'熱',软:'軟',润:'潤',扫:'掃',设:'設',摄:'攝',实:'實',视:'視',适:'適',寿:'壽',输:'輸',属:'屬',术:'術',数:'數',说:'說',丝:'絲',缩:'縮',统:'統',头:'頭',图:'圖',维:'維',为:'為',温:'溫',稳:'穩',无:'無',雾:'霧',细:'細',显:'顯',详:'詳',项:'項',续:'續',选:'選',讯:'訊',压:'壓',哑:'啞',烟:'煙',颜:'顏',验:'驗',样:'樣',业:'業',义:'義',艺:'藝',异:'異',应:'應',预:'預',运:'運',择:'擇',栅:'柵',种:'種',轴:'軸',转:'轉',装:'裝',组:'組',机:'機',锡:'錫',体:'體',时:'時',记:'記',采:'採'};
const TC_PHRASES=[['信息','資訊'],['软件','軟體'],['硬件','硬體'],['电脑','電腦'],['摄像头','攝影機'],['工作台','工作台'],['采集','採集'],['通讯','通訊'],['金属','金屬'],['引脚','引腳'],['后面板','後面板'],['目录','目錄']];
function fallbackTC(value){let text=String(value);for(const [from,to] of TC_PHRASES)text=text.replaceAll(from,to);return [...text].map(ch=>TC_CHAR_MAP[ch]||ch).join('')}
let cachedTC=null;
function getTC(){
  if(cachedTC)return cachedTC;
  try{if(window.OpenCC&&typeof OpenCC.Converter==='function')cachedTC=OpenCC.Converter({from:'cn',to:'tw'})}catch(_){}
  return cachedTC||fallbackTC;
}
function xmlText(value){return value.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")}
function xmlEscape(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function translateXmlText(xml,converter){return xml.replace(/(<a:t\b[^>]*>)([\s\S]*?)(<\/a:t>)/g,(_,open,text,close)=>{let value=converter(xmlText(text));if(/^20\d{6}$/.test(value))value=value.slice(0,4)+'.'+value.slice(4,6)+'.'+value.slice(6);return open+xmlEscape(value)+close})}
function clearQuickFooterShapes(xml){
  return xml.replace(/<p:sp\b[\s\S]*?<\/p:sp>/g,shape=>{
    const joined=[...shape.matchAll(/<a:t\b[^>]*>([\s\S]*?)<\/a:t>/g)].map(m=>xmlText(m[1])).join('');
    if(/(?:QUICK\s+INTELLIGENT\s+EQUIPMENT|FIND\s+OUT\s+MORE\s+ON\s+QUICK-GLOBAL\.COM|quick-global\.com|400-789-7899|快克智能装备股份有限公司|快克智能裝備股份有限公司|报告日期|報告日期)/i.test(joined))return shape.replace(/(<a:t\b[^>]*>)[\s\S]*?(<\/a:t>)/g,'$1$2');
    return shape;
  });
}
function removeClosingBrandPictures(xml,slideW,slideH){
  return xml.replace(/<p:pic\b[\s\S]*?<\/p:pic>/g,pic=>{
    const ext=pic.match(/<a:xfrm\b[\s\S]*?<a:ext cx="(\d+)" cy="(\d+)"\s*\/>/);
    if(!ext)return pic;
    const width=Number(ext[1]),height=Number(ext[2]);
    return width>=slideW*.8&&height>=slideH*.8?pic:'';
  });
}
function logoXml(slideXml,rId,slideW,slideH,aspect,isCover=false,isClosing=false){
  const ids=[...slideXml.matchAll(/<p:cNvPr\b[^>]*\bid="(\d+)"/g)].map(m=>Number(m[1]));
  const shapeId=Math.max(1,...ids)+1,picId=shapeId+1;
  const x=Math.round(slideW*.76),y=Math.round(slideH*.02),boxW=Math.round(slideW*.23),boxH=Math.round(slideH*.14);
  const maxW=boxW*.90,maxH=boxH*.78,logoW=Math.min(maxW,maxH*aspect),logoH=logoW/aspect;
  const logoX=Math.round(x+(boxW-logoW)/2),logoY=Math.round(y+(boxH-logoH)/2);
  const bg=isCover||isClosing?'':'<p:sp><p:nvSpPr><p:cNvPr id="'+shapeId+'" name="VECTECH Logo Background"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="'+x+'" y="'+y+'"/><a:ext cx="'+boxW+'" cy="'+boxH+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr></p:sp>';
  const pic='<p:pic><p:nvPicPr><p:cNvPr id="'+picId+'" name="VECTECH Company Logo" descr="VECTECH company logo"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="'+rId+'"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="'+logoX+'" y="'+logoY+'"/><a:ext cx="'+Math.round(logoW)+'" cy="'+Math.round(logoH)+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>';
  let coverPic='';
  if(isCover){
    const coverX=Math.round(slideW*.30),coverY=Math.round(slideH*.69),coverW=Math.round(slideW*.40),coverH=Math.round(slideH*.20);
    const maxCoverW=coverW*.90,maxCoverH=coverH*.70,coverLogoW=Math.min(maxCoverW,maxCoverH*aspect),coverLogoH=coverLogoW/aspect;
    const coverLogoX=Math.round(coverX+(coverW-coverLogoW)/2),coverLogoY=Math.round(coverY+(coverH-coverLogoH)/2);
    coverPic='<p:pic><p:nvPicPr><p:cNvPr id="'+(picId+1)+'" name="VECTECH Cover Logo" descr="VECTECH company logo"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="'+rId+'"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="'+coverLogoX+'" y="'+coverLogoY+'"/><a:ext cx="'+Math.round(coverLogoW)+'" cy="'+Math.round(coverLogoH)+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>';
  }
  return slideXml.replace('</p:spTree>',bg+pic+coverPic+'</p:spTree>');
}
function addImageRelationship(xml,rId,target='../media/vectech-company-logo.png'){
  const rel='<Relationship Id="'+rId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+target+'"/>';
  if(xml.includes('</Relationships>'))return xml.replace('</Relationships>',rel+'</Relationships>');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rel+'</Relationships>';
}
async function addSlideImageRelations(zip,slideName,targets){
  const relPath=slideName.replace('ppt/slides/','ppt/slides/_rels/')+'.rels';
  let rels=zip.file(relPath)?await zip.file(relPath).async('string'):'';
  const ids=[...rels.matchAll(/\bId="rId(\d+)"/g)].map(m=>Number(m[1]));let next=Math.max(0,...ids)+1;const out=[];
  for(const target of targets){const rid='rId'+next++;rels=addImageRelationship(rels,rid,'../media/'+target);out.push(rid)}
  zip.file(relPath,rels,{compression:'DEFLATE'});return out;
}
async function removeQuickLayoutBranding(zip){
  const quickAssets=new Set(['image1.png','image5.png','image7.png','image8.png','image9.png','image10.png']);
  for(const name of Object.keys(zip.files).filter(n=>/^ppt\/slideLayouts\/slideLayout\d+\.xml$/.test(n))){
    let xml=await zip.file(name).async('string');
    const relPath=name.replace('ppt/slideLayouts/','ppt/slideLayouts/_rels/')+'.rels';
    if(zip.file(relPath)){
      const rels=await zip.file(relPath).async('string');
      const targetById=new Map([...rels.matchAll(/<Relationship\b([^>]*?)\/>/g)].map(m=>[((m[1].match(/\bId="([^"]+)"/)||[])[1]),((m[1].match(/\bTarget="([^"]+)"/)||[])[1]||'').split('/').pop().toLowerCase()]));
      xml=xml.replace(/<p:pic\b[\s\S]*?<\/p:pic>/g,pic=>{const rid=(pic.match(/r:embed="([^"]+)"/)||[])[1];return quickAssets.has(targetById.get(rid))?'':pic});
    }
    xml=clearQuickFooterShapes(xml);
    zip.file(name,xml,{compression:'DEFLATE'});
  }
}
function textShapeXml(id,name,x,y,cx,cy,text,opts={}){
  x=Math.round(x);y=Math.round(y);cx=Math.round(cx);cy=Math.round(cy);const size=Math.round((opts.size||14)*100),color=opts.color||'334155',bold=opts.bold?' b="1"':'',align=opts.align||'l',font=opts.font||'Microsoft JhengHei';
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="'+xmlEscape(name)+'"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="'+x+'" y="'+y+'"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" rIns="0" tIns="0" bIns="0" anchor="ctr"/><a:lstStyle/><a:p><a:pPr algn="'+align+'"/><a:r><a:rPr lang="zh-TW" sz="'+size+'"'+bold+' dirty="0"><a:solidFill><a:srgbClr val="'+color+'"/></a:solidFill><a:latin typeface="'+xmlEscape(font)+'"/><a:ea typeface="'+xmlEscape(font)+'"/></a:rPr><a:t xml:space="preserve">'+xmlEscape(text)+'</a:t></a:r><a:endParaRPr lang="zh-TW" sz="'+size+'"/></a:p></p:txBody></p:sp>';
}
function rectShapeXml(id,name,x,y,cx,cy,color){
  x=Math.round(x);y=Math.round(y);cx=Math.round(cx);cy=Math.round(cy);
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="'+xmlEscape(name)+'"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="'+x+'" y="'+y+'"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:solidFill><a:srgbClr val="'+color+'"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr></p:sp>';
}
function pictureShapeXml(id,name,rId,x,y,cx,cy,descr=''){
  x=Math.round(x);y=Math.round(y);cx=Math.round(cx);cy=Math.round(cy);
  return '<p:pic><p:nvPicPr><p:cNvPr id="'+id+'" name="'+xmlEscape(name)+'" descr="'+xmlEscape(descr)+'"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="'+rId+'"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="'+x+'" y="'+y+'"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>';
}
function templateSlideXml(xml,shapes){
  xml=xml.replace(/<p:sld\b([^>]*)>/,(_,attrs)=>'<p:sld'+(attrs.includes('showMasterSp=')?attrs.replace(/showMasterSp="[^"]*"/,'showMasterSp="0"'):attrs+' showMasterSp="0"')+'>');
  const tree='<p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>'+shapes+'</p:spTree>';
  const bg='<p:bg><p:bgPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:effectLst/></p:bgPr></p:bg>';
  return xml.replace(/<p:cSld\b[^>]*>[\s\S]*?<\/p:cSld>/,'<p:cSld>'+bg+tree+'</p:cSld>');
}
function fitLogoBox(slideW,slideH,aspect,maxW,maxH,x,y){
  const w=Math.min(maxW,maxH*aspect),h=w/aspect;return{x:Math.round(x+(maxW-w)/2),y:Math.round(y+(maxH-h)/2),w:Math.round(w),h:Math.round(h)};
}

  out+=textShapeXml(id++,'承邦公司網址',slideW*.15,slideH*.79,slideW*.70,slideH*.06,'http://www.cbtrade.com.tw',{size:13,color:'64748B',align:'ctr'});

function projectCoverShapes(slideW,slideH,aspect,logoRid,meta){
  let id=2;const logo=fitLogoBox(slideW,slideH,aspect,slideW*.17,slideH*.10,slideW*.79,slideH*.015);

  await removeQuickLayoutBranding(zip);
  for(const [index,name] of slideNames.entries()){
    setStatus('正在處理第 '+(index+1)+' / '+slideNames.length+' 張投影片','繁體中文轉換、清除 QUICK 背景並套用承邦版面');
    let xml=await zip.file(name).async('string');

    const relTargets=new Map([...rels.matchAll(/<Relationship\b([^>]*?)\/>/g)].map(m=>[((m[1].match(/\bId="([^"]+)"/)||[])[1]),((m[1].match(/\bTarget="([^"]+)"/)||[])[1]||'').split('/').pop().toLowerCase()]));
    xml=xml.replace(/<p:pic\b[\s\S]*?<\/p:pic>/g,pic=>{const rid=(pic.match(/r:embed="([^"]+)"/)||[])[1];return quickAssets.has(relTargets.get(rid))?'':pic});

      const relMatches=[...rels.matchAll(/\bId="rId(\d+)"/g)].map(m=>Number(m[1]));

function getProjectMeta(name){
  const base=name.replace(/\.(pdf|pptx)$/i,'');
  const idMatch=base.match(/TWXBCB\d+(?:-\d{8})?/i);
  const id=idMatch?idMatch[0]:'';
  const versionMatch=base.match(/V\d+(?:\.\d+)?/i);
  const version=versionMatch?versionMatch[0]:'VER1.0';

  let title='';
  if(id){
    const after=base.slice(id.length).replace(/^[-_]+/,'');
    title=after.split(/20\d{2}[-.]?\d{2}[-.]?\d{2}/)[0].replace(/[-_]+$/,'').trim();
  }
  if(!title){
    const chinese=base.match(/[\u3400-\u9fff]{2,}/);
    title=chinese?chinese[0]:'紅外線BGA返修設備';
  }

  const dates=[...base.matchAll(/20\d{2}[-.]?\d{2}[-.]?\d{2}/g)].map(m=>m[0]);
  const date=dates.length?dates[dates.length-1]:'';
  const dateDigits=date.replace(/\D/g,'');
  const formattedDate=/^\d{8}$/.test(dateDigits)?dateDigits.slice(0,4)+'.'+dateDigits.slice(4,6)+'.'+dateDigits.slice(6):date.replace(/-/g,'.');
  return {id,date:formattedDate,version,title:getTC()(title)};
}
function makeOutputName(originalName){
  let base=String(originalName||'未命名');
  base=base.replace(/\.(pdf|pptx)$/i,'').replace(/\s*\(\d+\)$/,'');
  // 移除任何數量的「承邦轉檔」前綴（含底線、連字號或空白）。
  base=base.replace(/^(?:承邦轉檔(?:[_\-\s]*)?)+/,'');
  // 來源檔名的簡體中文一律轉成繁體中文。
  base=getTC()(base);
  // 再做一次固定字串清理，避免任何舊版本名稱混入。
  base=base.replace(/承邦轉檔/g,'').replace(/^[_\-\s]+/,'');
  return base+'.pptx';
}
function fitFont(ctx,text,maxWidth,start){
  let size=start;
  while(size>12){ctx.font='700 '+size+'px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif';if(ctx.measureText(text).width<=maxWidth)return size;size-=1}

async function translatePdfPage(pdf,page,canvas,ctx,scale,converter){
  const text=await page.getTextContent();
  for(const item of text.items||[]){
    if(!item.str||!item.str.trim())continue;
    const translated=converter(item.str);
    if(translated===item.str)continue;
    const tx=item.transform;
    const x=tx[4]*scale;
    const y=canvas.height-(tx[5]*scale);
    const h=Math.max(14,Math.abs(tx[3]||tx[0]||12)*scale);
    const w=Math.max(20,(item.width||20)*scale);
    ctx.fillStyle='rgba(255,255,255,.96)';
    ctx.fillRect(x-2,y-h-3,w+5,h+7);
    const fs=Math.max(12,Math.min(42,h*.9));
    ctx.font='500 '+fs+'px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif';
    ctx.fillStyle='#222';
    ctx.textBaseline='alphabetic';
    ctx.fillText(translated,x,y);
  }
}

async function prepareUserLogo(logoData){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const src=document.createElement('canvas');
      src.width=img.naturalWidth; src.height=img.naturalHeight;
      const sctx=src.getContext('2d',{willReadFrequently:true});
      sctx.drawImage(img,0,0);
      const imageData=sctx.getImageData(0,0,src.width,src.height);
      const d=imageData.data;
      let minX=src.width,minY=src.height,maxX=-1,maxY=-1;

      for(let y=0;y<src.height;y++){
        for(let x=0;x<src.width;x++){
          const p=(y*src.width+x)*4;
          const r=d[p],g=d[p+1],b=d[p+2];
          const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
          const sat=mx===0?0:(mx-mn)/mx;
          const lum=(r+g+b)/3;

          // Logo 檔是 JPG 時，背景通常包含白、淡灰、灰白紋理。
          // 將「亮色低飽和」以及「中亮度低飽和灰階」全部透明化。
          let alpha=255;
          if((lum>180 && sat<0.42) || (lum>145 && sat<0.18)){
            alpha=0;
          }
          // 再清除接近白色的任何殘留。
          if(r>225 && g>225 && b>225) alpha=0;
          d[p+3]=alpha;

          if(alpha>18){
            if(x<minX)minX=x;if(x>maxX)maxX=x;
            if(y<minY)minY=y;if(y>maxY)maxY=y;
          }
        }
      }
      sctx.putImageData(imageData,0,0);

      // 只保留去背後真正的 Logo 範圍，避免原 JPG 的白色畫布再次被放大。
      if(maxX<minX || maxY<minY){ resolve(src); return; }
      const pad=Math.max(2,Math.round(Math.min(src.width,src.height)*.01));
      minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
      maxX=Math.min(src.width-1,maxX+pad); maxY=Math.min(src.height-1,maxY+pad);
      const out=document.createElement('canvas');
      out.width=maxX-minX+1; out.height=maxY-minY+1;
      out.getContext('2d').drawImage(src,minX,minY,out.width,out.height,0,0,out.width,out.height);
      resolve(out);
    };
    img.onerror=reject;
    img.src=logoData;
  });
}

async function eraseQuickLogoAndPlaceUserLogo(ctx,w,h,logoData){
  // QUICK 原 Logo 固定位於內容頁右上角。
  // 先完整清空該區域，再放入使用者 Logo，確保不會殘留 QUICK 字樣。
  // 清除範圍避開下方設備圖與標題內容。
  const x=Math.floor(w*.805);
  const y=0;
  const rw=Math.floor(w*.195);
  const rh=Math.floor(h*.155);
  ctx.save();
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(x,y,rw,rh);
  ctx.restore();

  if(!logoData)return;
  const logoCanvas=await prepareUserLogo(logoData);

  // Logo 優先放大，但只能放在剛清空的右上安全區。
  const maxW=rw*.92, maxH=rh*.78;
  const ratio=Math.min(maxW/logoCanvas.width,maxH/logoCanvas.height);
  const lw=logoCanvas.width*ratio,lh=logoCanvas.height*ratio;
  const lx=x+(rw-lw)/2,ly=y+(rh-lh)/2;
  ctx.drawImage(logoCanvas,lx,ly,lw,lh);
}

async function pdfToPptx(file,logo){
  await waitForGlobal('pdfjsLib',15000,'PDF 轉檔程式尚未載入，請確認網路後重試');
  const data=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data}).promise;
  if(!pdf.numPages)throw new Error('PDF 沒有可轉換的頁面');
  const first=await pdf.getPage(1), base=first.getViewport({scale:1});
  const ratio=base.height/base.width, slideW=10, slideH=Math.max(5.625,Math.min(13.333,slideW*ratio));
  const pptx=new PptxGenJS();pptx.defineLayout({name:'CBPDF',width:slideW,height:slideH});pptx.layout='CBPDF';
  pptx.author='承邦有限公司';pptx.subject='PDF 轉 PPTX';pptx.title='承邦 PDF 轉 PPTX';
  const converter=getTC(); const meta=getProjectMeta(file.name); meta.title=converter(meta.title||'紅外線BGA返修設備').replace(/红外线/g,'紅外線').replace(/返修/g,'返修').replace(/设备/g,'設備'); const logoData=await getCompanyLogoData(logo);

    const canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
    const ctx=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport:vp}).promise;
    if(i>1 && i<pdf.numPages) await translatePdfPage(pdf,page,canvas,ctx,1.5,converter);
    if(i===1){
      const machine=canvas;const cover=document.createElement('canvas');cover.width=canvas.width;cover.height=canvas.height;
      const cctx=cover.getContext('2d',{alpha:false});await drawHeaderTemplate(cctx,cover.width,cover.height,meta,null,logoData); 
      const img=cover.toDataURL('image/jpeg',.9);const slide=pptx.addSlide();slide.background={color:'FFFFFF'};slide.addImage({data:img,x:0,y:0,w:slideW,h:slideH});
    }else if(i===pdf.numPages){
      const foot=document.createElement('canvas');foot.width=canvas.width;foot.height=canvas.height;drawFooterTemplate(foot.getContext('2d',{alpha:false}),foot.width,foot.height);
      const img=foot.toDataURL('image/jpeg',.9);const slide=pptx.addSlide();slide.background={color:'FFFFFF'};slide.addImage({data:img,x:0,y:0,w:slideW,h:slideH});
    }else{
      // 所有內容頁：清除右下角 QUICK 網址／電話與左下角 QUICK 標誌文字，
      // 再清除右上角 QUICK Logo，最後放入使用者 Logo。
      const fw=canvas.width, fh=canvas.height;
      ctx.save();
      ctx.fillStyle='#FFFFFF';
      ctx.fillRect(fw*.76,fh*.935,fw*.24,fh*.065);
      ctx.fillRect(0,fh*.935,fw*.24,fh*.065);
      ctx.restore();
      await eraseQuickLogoAndPlaceUserLogo(ctx,fw,fh,logoData);
      const img=canvas.toDataURL('image/jpeg',.88);
      const slide=pptx.addSlide();
      slide.background={color:'FFFFFF'};
      slide.addImage({data:img,x:0,y:0,w:slideW,h:slideH});
    }
    canvas.width=1;canvas.height=1;
  }

}

     catch(x){if(x.name==='AbortError')show('ok','✅ 轉檔完成。檔案已準備好，可重新操作分享／儲存。');else download(blob,name)}
   }else download(blob,name);
 }catch(x){
   hide('status');show('err','❌ 轉檔失敗：'+(x&&x.message?x.message:'未知錯誤'));
 }finally{$('submit').disabled=false}
});
